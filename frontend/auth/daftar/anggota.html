<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Anggota - E-Perpustakaan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-idcard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M13 10h5M13 14h5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  </svg>

  <main class="auth-page">
    <section class="auth-card auth-card--wide" aria-labelledby="judul">

      <header class="auth-card__header auth-card__header--row">
        <a class="back-link back-link--dark" data-route="../login/anggota.html" role="link" tabindex="0" aria-label="Kembali ke halaman login">
          <svg class="icon icon--lg" aria-hidden="true"><use href="#i-arrow-left"/></svg>
        </a>
        <h1 class="auth-card__title auth-card__title--form" id="judul">Daftar Anggota</h1>
      </header>

      <div class="form" data-auth-form="register" data-user-role="anggota">

        <div class="form__group">
          <label class="form__label" for="nama">Masukkan nama lengkap</label>
          <div class="input-field">
            <span class="input-field__icon"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg></span>
            <input class="form__input form__input--icon" id="nama" name="nama" type="text" placeholder="Contoh: Muhammad Raihan Pratama">
          </div>
        </div>

        <div class="form__group">
          <label class="form__label" for="npm">Masukkan NPM</label>
          <div class="input-field">
            <span class="input-field__icon"><svg class="icon" aria-hidden="true"><use href="#i-idcard"/></svg></span>
            <input class="form__input form__input--icon" id="npm" name="npm" type="text" placeholder="Contoh: 07352011048">
          </div>
        </div>

        <div class="form__group">
          <label class="form__label" for="prodi">Masukkan prodi anda</label>
          <div class="input-field">
            <span class="input-field__icon"><svg class="icon" aria-hidden="true"><use href="#i-cap"/></svg></span>
            <input class="form__input form__input--icon" id="prodi" name="prodi" type="text" placeholder="Contoh: Teknik Informatika">
          </div>
        </div>

        <div class="form__group">
          <label class="form__label" for="email">Masukkan Email anda</label>
          <div class="input-field">
            <span class="input-field__icon"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg></span>
            <input class="form__input form__input--icon" id="email" name="email" type="email" placeholder="Contoh: nama@gmail.com">
          </div>
        </div>

        <div class="form__group">
          <label class="form__label" for="password">Masukkan Password anda</label>
          <div class="input-field">
            <span class="input-field__icon"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg></span>
            <input class="form__input form__input--icon" id="password" name="password" type="password" placeholder="Minimal 8 karakter unik">
            <span class="input-field__toggle"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></span>
          </div>
        </div>

        <div class="form__group">
          <label class="form__label" for="password-confirm">Konfirmasi password anda</label>
          <div class="input-field">
            <span class="input-field__icon"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg></span>
            <input class="form__input form__input--icon form__input--error" id="password-confirm" name="password-confirm" type="password" placeholder="Ulangi password anda" aria-invalid="true">
            <span class="input-field__toggle"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></span>
          </div>
          <p class="form__error" role="alert">password confirmation doesn't match</p>
        </div>

        <button class="btn btn--primary btn--block btn--tall form__submit" type="button" data-auth-action="register">Daftar</button>

      </div>
    </section>
  </main>
</body>
</html>
