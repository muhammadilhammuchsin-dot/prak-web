<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Akun Pustakawan - E-Perpustakaan</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- CSS yang sudah tersedia -->
  <link rel="stylesheet" href="../../css/shared/variables.css">
  <link rel="stylesheet" href="../../css/shared/base.css">
  <link rel="stylesheet" href="../../css/shared/utilities.css">
  <link rel="stylesheet" href="../../css/shared/components.css">
  <link rel="stylesheet" href="../../css/auth/auth.css">
  <link rel="stylesheet" href="../../css/shared/layout.css">
  <link rel="stylesheet" href="../../css/shared/responsive.css">
</head>
<body class="auth-register">
  <!-- Kumpulan ikon -->
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-arrow-left" viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </symbol>
    <symbol id="i-id-card" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <circle cx="8" cy="10" r="2"/>
      <path d="M5.5 16c.7-1.5 1.5-2 2.5-2s1.8.5 2.5 2M14 9h4M14 13h4"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </symbol>
    <symbol id="i-shield-check" viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
      <path d="m9 12 2 2 4-4"/>
    </symbol>
    <symbol id="i-eye" viewBox="0 0 24 24">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
  </svg>

  <main class="auth-page">
    <section class="auth-card register-card" aria-labelledby="judul">
      <!-- Header dan tombol kembali -->
      <header class="register-header">
        <a class="register-back" href="../login/pustakawan.html" aria-label="Kembali ke login Pustakawan">
          <svg class="icon" aria-hidden="true">
            <use href="#i-arrow-left"/>
          </svg>
        </a>
        <h1 class="register-title" id="judul">Buat Akun</h1>
      </header>

      <!-- Form pendaftaran Pustakawan -->
      <form class="form register-form"
            data-auth-form="register"
            data-user-role="pustakawan"
            method="post"
            novalidate>
        <!-- Role ditetapkan otomatis berdasarkan halaman -->
        <input type="hidden" name="role" value="pustakawan">

        <!-- Nama lengkap -->
        <div class="form__group register-group">
          <label class="form__label register-label" for="nama">
            Masukkan nama lengkap
          </label>
          <div class="input-field register-input-field">
            <span class="input-field__icon register-input-icon">
              <svg class="icon" aria-hidden="true">
                <use href="#i-user"/>
              </svg>
            </span>
            <input class="form__input form__input--icon register-input"
                   id="nama"
                   name="nama"
                   type="text"
                   placeholder="Nama Lengkap"
                   autocomplete="name"
                   minlength="3"
                   maxlength="100"
                   required
                   aria-describedby="nama-error">
          </div>
          <p class="form__error register-error"
             id="nama-error"
             data-error-for="nama"
             role="alert"
             hidden></p>
        </div>

        <!-- NIP atau kode Pustakawan -->
        <div class="form__group register-group">
          <label class="form__label register-label" for="npm">
            Masukkan NIP/kode pustakawan
          </label>
          <div class="input-field register-input-field">
            <span class="input-field__icon register-input-icon">
              <svg class="icon" aria-hidden="true">
                <use href="#i-id-card"/>
              </svg>
            </span>
            <input class="form__input form__input--icon register-input"
                   id="npm"
                   name="npm"
                   type="text"
                   placeholder="NIP / Kode Pustakawan"
                   autocomplete="username"
                   minlength="3"
                   maxlength="40"
                   required
                   aria-describedby="npm-error">
          </div>
          <p class="form__error register-error"
             id="npm-error"
             data-error-for="npm"
             role="alert"
             hidden></p>
        </div>

        <!-- Password -->
        <div class="form__group register-group">
          <label class="form__label register-label" for="password">
            Masukkan Password anda
          </label>
          <div class="input-field register-input-field">
            <span class="input-field__icon register-input-icon">
              <svg class="icon" aria-hidden="true">
                <use href="#i-lock"/>
              </svg>
            </span>
            <input class="form__input form__input--icon form__input--with-toggle register-input"
                   id="password"
                   name="password"
                   type="password"
                   placeholder="Password"
                   autocomplete="new-password"
                   minlength="8"
                   required
                   aria-describedby="password-error">
            <button class="input-field__toggle register-toggle"
                    type="button"
                    data-toggle-password="password"
                    aria-label="Tampilkan password"
                    aria-pressed="false">
              <svg class="icon" aria-hidden="true">
                <use href="#i-eye"/>
              </svg>
            </button>
          </div>
          <p class="form__error register-error"
             id="password-error"
             data-error-for="password"
             role="alert"
             hidden></p>
        </div>

        <!-- Konfirmasi password -->
        <div class="form__group register-group">
          <label class="form__label register-label" for="konfirmasi_password">
            Konfirmasi password anda
          </label>
          <div class="input-field register-input-field">
            <span class="input-field__icon register-input-icon">
              <svg class="icon" aria-hidden="true">
                <use href="#i-shield-check"/>
              </svg>
            </span>
            <input class="form__input form__input--icon form__input--with-toggle register-input"
                   id="konfirmasi_password"
                   name="konfirmasi_password"
                   type="password"
                   placeholder="Password yang sama"
                   autocomplete="new-password"
                   required
                   aria-describedby="konfirmasi-password-error">
            <button class="input-field__toggle register-toggle"
                    type="button"
                    data-toggle-password="konfirmasi_password"
                    aria-label="Tampilkan konfirmasi password"
                    aria-pressed="false">
              <svg class="icon" aria-hidden="true">
                <use href="#i-eye"/>
              </svg>
            </button>
          </div>
          <p class="form__error register-error"
             id="konfirmasi-password-error"
             data-error-for="konfirmasi_password"
             role="alert"
             hidden></p>
        </div>

        <!-- Tombol daftar -->
        <button class="btn btn--primary register-submit" type="submit">
          Daftar
        </button>

        <!-- Pesan hasil pendaftaran -->
        <p class="auth-feedback register-feedback"
           data-auth-feedback
           role="status"
           aria-live="polite"
           hidden></p>
      </form>
    </section>
  </main>

  <!-- JavaScript autentikasi petugas -->
  <script src="../../js/auth/staff-auth.js" defer></script>
</body>
</html>
