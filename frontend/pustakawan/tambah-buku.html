
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah Buku - E-Perpustakaan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/shared/variables.css">
  <link rel="stylesheet" href="../css/shared/base.css">
  <link rel="stylesheet" href="../css/shared/utilities.css">
  <link rel="stylesheet" href="../css/shared/components.css">
  <link rel="stylesheet" href="../css/shared/layout.css">
  <link rel="stylesheet" href="../css/pustakawan/pustakawan.css">
  <link rel="stylesheet" href="../css/shared/responsive.css">
</head>
<body>

  <!-- ICON YANG SAMA DENGAN HALAMAN LAIN -->
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </symbol>

    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7"/>
      <rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/>
    </symbol>

    <symbol id="i-users" viewBox="0 0 24 24">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>

    <symbol id="i-swap" viewBox="0 0 24 24">
      <path d="M17 1l4 4-4 4"/>
      <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
      <path d="M7 23l-4-4 4-4"/>
      <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
    </symbol>

    <symbol id="i-logout" viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <path d="m16 17 5-5-5-5"/>
      <path d="M21 12H9"/>
    </symbol>
  </svg>

  <div class="admin-layout">

    <!-- SIDEBAR BERSAMA -->
    <aside class="sidebar">

      <div class="brand brand--light">
        <span class="brand__icon">
          <svg class="icon" aria-hidden="true">
            <use href="#i-book"/>
          </svg>
        </span>
        <span class="brand__name">E-Perpustakaan</span>
      </div>

      <nav class="sidebar__nav" aria-label="Menu pustakawan">

        <a href="beranda.html"
           class="sidebar__link"
           data-route="beranda.html">
          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-grid"/>
          </svg>
          <span>Beranda</span>
        </a>

        <a href="data-buku.html"
           class="sidebar__link sidebar__link--active"
           data-route="data-buku.html"
           aria-current="page">
          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-book"/>
          </svg>
          <span>Data Buku</span>
        </a>

        <a href="data-anggota.html"
           class="sidebar__link"
           data-route="data-anggota.html">
          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-users"/>
          </svg>
          <span>Data Anggota</span>
        </a>

        <a href="transaksi.html"
           class="sidebar__link"
           data-route="transaksi.html">
          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-swap"/>
          </svg>
          <span>Transaksi</span>
        </a>

        <a href="../auth/login/pustakawan.html"
           class="sidebar__link sidebar__link--logout">
          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-logout"/>
          </svg>
          <span>Keluar</span>
        </a>

      </nav>
    </aside>

    <!-- KONTEN TAMBAH BUKU -->
    <main class="admin-content pb-main">

      <h1 class="pb-form-title">Tambah buku baru</h1>

      <form id="bookForm" class="pb-book-form" enctype="multipart/form-data">

        <div class="pb-form-grid">

          <!-- UPLOAD GAMBAR -->
          <div class="pb-upload-section">

            <label for="gambar" class="pb-upload-box">

              <img id="coverPreview"
                   class="pb-cover-preview"
                   alt="Pratinjau sampul buku"
                   hidden>

              <div id="uploadPlaceholder" class="pb-upload-placeholder">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
                  <circle cx="12" cy="13" r="4"/>
                </svg>
              </div>

            </label>

            <input type="file"
                   id="gambar"
                   name="gambar"
                   accept="image/jpeg,image/png,image/webp"
                   hidden>

            <label for="gambar" class="pb-upload-caption">
              Upload gambar
            </label>

          </div>

          <!-- INPUT BUKU -->
          <div class="pb-fields">

            <div class="pb-field">
              <label for="judul">Judul buku</label>
              <input type="text"
                     id="judul"
                     name="judul"
                     placeholder="masukkan judul buku"
                     maxlength="200"
                     required>
            </div>

            <div class="pb-field">
              <label for="id-buku">ID buku</label>
              <input type="text"
                     id="id-buku"
                     name="id_buku"
                     placeholder="masukkan ID buku"
                     maxlength="50"
                     required>
            </div>

            <div class="pb-field">
              <label for="penulis">Penulis</label>
              <input type="text"
                     id="penulis"
                     name="penulis"
                     placeholder="masukkan nama penulis"
                     maxlength="150"
                     required>
            </div>

            <div class="pb-field">
              <label for="kategori">Kategori</label>
              <select id="kategori" name="kategori" required>
                <option value="">Pilih Kategori...</option>
                <option value="Informatika & Komputer">Informatika & Komputer</option>
                <option value="Sains & Matematika">Sains & Matematika</option>
                <option value="Sastra & Bahasa">Sastra & Bahasa</option>
                <option value="Sosial & Bisnis">Sosial & Bisnis</option>
              </select>
            </div>

            <div class="pb-field">
              <label for="stok">Stok</label>
              <input type="number"
                     id="stok"
                     name="stok"
                     placeholder="masukkan jumlah stok"
                     min="0"
                     step="1"
                     required>
            </div>

            <div class="pb-field">
              <label for="deskripsi">Deskripsi</label>
              <textarea id="deskripsi"
                        name="deskripsi"
                        placeholder="masukkan deskripsi buku..."
                        rows="5"></textarea>
            </div>

          </div>
        </div>

        <!-- TOMBOL -->
        <div class="pb-form-actions">
          <a href="beranda.html" class="pb-cancel-button">Batal</a>
          <button type="submit"
                  id="saveBookButton"
                  class="pb-save-button">
            Simpan
          </button>
        </div>

        <p id="bookFeedback"
           class="pb-feedback"
           role="status"
           aria-live="polite"></p>

      </form>

    </main>
  </div>

  <script src="../js/pustakawan/buku.js" defer></script>
  <script src="../js/shared/app.js" defer></script>

</body>
</html>
