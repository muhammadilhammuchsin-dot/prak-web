
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah Buku - E-Perpustakaan</title>
  <!-- Font dari Google Fonts (butuh internet) dan file CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Kumpulan ikon halaman ini; dipanggil dengan <use href="#i-nama"> -->
  <svg class="icon-sprite" aria-hidden="true"><symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol><symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol><symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol></svg>

  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand brand--light">
        <span class="brand__icon"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg></span>
        <span class="brand__name">E-Perpustakaan</span>
      </div>

      <nav class="sidebar__nav" aria-label="Menu pustakawan">
        <a class="sidebar__link" data-route="beranda.html" role="link" tabindex="0"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-grid"/></svg> Beranda</a>
        <a class="sidebar__link sidebar__link--active" data-route="data-buku.html" aria-current="page" role="link" tabindex="0"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-book"/></svg> Data Buku</a>
        <a class="sidebar__link" data-route="data-anggota.html" role="link" tabindex="0"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-users"/></svg> Data Anggota</a>
        <a class="sidebar__link" data-route="transaksi.html" role="link" tabindex="0"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-swap"/></svg> Transaksi</a>
        <a class="sidebar__link sidebar__link--logout" data-route="../auth/login/pustakawan.html" role="link" tabindex="0"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-logout"/></svg> Keluar</a>
      </nav>
    </aside>

    <main class="admin-content">
      <h1 class="page-title">Tambah buku baru</h1>

      <div data-book-form>
        <div class="panel book-form">
          <div>
            <label class="upload-box" for="gambar">
              <span class="upload-box__icon"><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg></span>
              upload gambar
            </label>
            <input class="visually-hidden" id="gambar" name="gambar" type="file" accept="image/*">
          </div>

          <div class="form">
            <div class="form__group">
              <label class="form__label" for="judul">Judul buku</label>
              <input class="form__input form__input--plain" id="judul" name="judul" placeholder="masukkan judul buku">
            </div>

            <div class="form__group">
              <label class="form__label" for="id-buku">ID buku</label>
              <input class="form__input form__input--plain" id="id-buku" name="id-buku" placeholder="masukkan ID buku">
            </div>

            <div class="form__group">
              <label class="form__label" for="penulis">Penulis</label>
              <input class="form__input form__input--plain" id="penulis" name="penulis" placeholder="masukkan nama penulis">
            </div>

            <div class="form__group">
              <label class="form__label" for="kategori">Kategori</label>
              <select class="form__input form__input--plain" id="kategori" name="kategori">
                <option value="">Pilih Kategori...</option>
                <option>Informatika &amp; Komputer</option>
                <option>Sains &amp; Matematika</option>
                <option>Sosial &amp; Bisnis</option>
                <option>Sastra &amp; Bahasa</option>
              </select>
            </div>

            <div class="form__group">
              <label class="form__label" for="stok">Stok</label>
              <input class="form__input form__input--plain" id="stok" name="stok" placeholder="masukkan jumlah stok">
            </div>

            <div class="form__group">
              <label class="form__label" for="deskripsi">Deskripsi</label>
              <textarea class="form__input form__input--plain" id="deskripsi" name="deskripsi" rows="4" placeholder="masukkan deskripsi buku..."></textarea>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <a class="btn btn--cancel" data-route="data-buku.html" role="link" tabindex="0">Batal</a>
          <button class="btn btn--navy" type="button" data-action="save-book">Simpan</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
