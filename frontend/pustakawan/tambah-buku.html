<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah Buku - E-Perpustakaan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/shared/variables.css">
  <link rel="stylesheet" href="../css/shared/base.css">
  <link rel="stylesheet" href="../css/shared/utilities.css">
  <link rel="stylesheet" href="../css/shared/components.css">
  <link rel="stylesheet" href="../css/shared/layout.css">
  <link rel="stylesheet" href="../css/pustakawan/pustakawan.css">
  <link rel="stylesheet" href="../css/shared/responsive.css">
</head>

<body class="pb-body">

  <div class="pb-layout">

    <!-- SIDEBAR -->
    <aside class="pb-sidebar">
      <a href="beranda.html" class="pb-brand">
        <span class="pb-brand-icon">♧</span>
        <span>E-Perpustakaan</span>
      </a>

      <nav class="pb-navigation">
        <a href="beranda.html" class="pb-nav-link">
          <span>▦</span> Beranda
        </a>

        <a href="data-buku.html" class="pb-nav-link active">
          <span>▣</span> Data Buku
        </a>

        <a href="data-anggota.html" class="pb-nav-link">
          <span>♙</span> Data Anggota
        </a>

        <a href="transaksi.html" class="pb-nav-link">
          <span>⇄</span> Transaksi
        </a>
      </nav>

      <a href="../auth/login/pustakawan.html" class="pb-logout">
        <span>⇥</span> Keluar
      </a>
    </aside>

    <!-- KONTEN -->
    <main class="pb-main">

      <h1 class="pb-form-title">Tambah buku baru</h1>

      <form id="bookForm" class="pb-book-form" enctype="multipart/form-data">

        <div class="pb-form-grid">

          <!-- UPLOAD SAMPUL -->
          <div class="pb-upload-section">

            <label for="gambar" class="pb-upload-box">

              <img
                id="coverPreview"
                class="pb-cover-preview"
                alt="Pratinjau sampul buku"
                hidden
              >

              <div id="uploadPlaceholder" class="pb-upload-placeholder">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
                  <circle cx="12" cy="13" r="4"/>
                </svg>
              </div>

            </label>

            <input
              type="file"
              id="gambar"
              name="gambar"
              accept="image/jpeg,image/png,image/webp"
              hidden
            >

            <label for="gambar" class="pb-upload-caption">
              Upload gambar
            </label>

            <p class="pb-upload-info">
              JPG, PNG, atau WEBP. Maksimal 5 MB.
            </p>

          </div>

          <!-- FORM INPUT -->
          <div class="pb-fields">

            <div class="pb-field">
              <label for="judul">Judul buku</label>
              <input
                type="text"
                id="judul"
                name="judul"
                placeholder="masukkan judul buku"
                maxlength="200"
                required
              >
            </div>

            <div class="pb-field">
              <label for="id-buku">ID buku</label>
              <input
                type="text"
                id="id-buku"
                name="id_buku"
                placeholder="masukkan ID buku"
                maxlength="50"
                required
              >
            </div>

            <div class="pb-field">
              <label for="penulis">Penulis</label>
              <input
                type="text"
                id="penulis"
                name="penulis"
                placeholder="masukkan nama penulis"
                maxlength="150"
                required
              >
            </div>

            <div class="pb-field">
              <label for="kategori">Kategori</label>
              <select id="kategori" name="kategori" required>
                <option value="">Pilih Kategori...</option>
                <option value="Informatika & Komputer">
                  Informatika & Komputer
                </option>
                <option value="Sains & Matematika">
                  Sains & Matematika
                </option>
                <option value="Sastra & Bahasa">
                  Sastra & Bahasa
                </option>
                <option value="Sosial & Bisnis">
                  Sosial & Bisnis
                </option>
              </select>
            </div>

            <div class="pb-field">
              <label for="stok">Stok</label>
              <input
                type="number"
                id="stok"
                name="stok"
                placeholder="masukkan jumlah stok"
                min="0"
                step="1"
                required
              >
            </div>

            <div class="pb-field">
              <label for="deskripsi">Deskripsi</label>
              <textarea
                id="deskripsi"
                name="deskripsi"
                placeholder="masukkan deskripsi buku..."
                rows="5"
              ></textarea>
            </div>

          </div>
        </div>

        <!-- TOMBOL -->
        <div class="pb-form-actions">

          <a href="data-buku.html" class="pb-cancel-button">
            Batal
          </a>

          <button
            type="submit"
            id="saveBookButton"
            class="pb-save-button"
          >
            Simpan
          </button>

        </div>

        <p id="bookFeedback" class="pb-feedback" role="status" aria-live="polite"></p>

      </form>

    </main>
  </div>

  <script src="../js/pustakawan/buku.js" defer></script>
  <script src="../js/shared/app.js" defer></script>

</body>
</html>
