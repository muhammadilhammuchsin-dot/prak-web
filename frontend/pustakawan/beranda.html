  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand brand--light">
        <span class="brand__icon"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg></span>

      <nav class="sidebar__nav" aria-label="Menu pustakawan">

        <a class="sidebar__link" href="data-buku.html"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-book"/></svg> Data Buku</a>

        </div>
      </section>

      <section>

        <div class="book-grid">
          <article class="book-card">
            <figure class="cover cover--banner">
          <img class="cover__image" src="../assets/covers/0002.jpg" alt="Sampul buku Rekayasa Perangkat Lunak Terapan">

            <h3 class="book-card__title">Rekayasa Perangkat Lunak Terapan</h3>

            <a class="btn btn--navy btn--block btn--small" href="data-buku.html"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-eye"/></svg> Detail</a>

          <article class="book-card">
            <figure class="cover cover--banner cover--placeholder">

        </figure>
            <h3 class="book-card__title">Basis Data Relasional &amp; Manajemen SQL</h3>
