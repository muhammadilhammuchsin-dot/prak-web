
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00236f">
  <title>Transaksi Peminjaman - E-Perpustakaan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS bersama -->
  <link rel="stylesheet" href="../css/shared/variables.css">
  <link rel="stylesheet" href="../css/shared/base.css">
  <link rel="stylesheet" href="../css/shared/utilities.css">
  <link rel="stylesheet" href="../css/shared/components.css">
  <link rel="stylesheet" href="../css/shared/layout.css">

  <!-- CSS pustakawan -->
  <link rel="stylesheet" href="../css/pustakawan/pustakawan.css">
  <link rel="stylesheet" href="../css/shared/responsive.css">
  <link rel="stylesheet" href="../css/pustakawan/transaksi.css">
</head>

<body class="transaction-page">

  <!-- ICON SPRITE -->
  <svg class="icon-sprite" aria-hidden="true">

    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </symbol>

    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7"/>
      <rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/>
    </symbol>

    <symbol id="i-logout" viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <path d="m16 17 5-5-5-5"/>
      <path d="M21 12H9"/>
    </symbol>

    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.3-4.3"/>
    </symbol>

    <symbol id="i-swap" viewBox="0 0 24 24">
      <path d="M17 1l4 4-4 4"/>
      <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
      <path d="M7 23l-4-4 4-4"/>
      <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
    </symbol>

    <symbol id="i-users" viewBox="0 0 24 24">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>

  </svg>

  <div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="brand brand--light">

        <span class="brand__icon">
          <svg class="icon" aria-hidden="true">
            <use href="#i-book"/>
          </svg>
        </span>

        <span class="brand__name">
          E-Perpustakaan
        </span>

      </div>

      <nav class="sidebar__nav" aria-label="Menu pustakawan">

        <a
          href="beranda.html"
          class="sidebar__link"
          data-route="beranda.html">

          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-grid"/>
          </svg>

          <span>Beranda</span>
        </a>

        <a
          href="data-buku.html"
          class="sidebar__link"
          data-route="data-buku.html">

          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-book"/>
          </svg>

          <span>Data Buku</span>
        </a>

        <a
          href="data-anggota.html"
          class="sidebar__link"
          data-route="data-anggota.html">

          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-users"/>
          </svg>

          <span>Data Anggota</span>
        </a>

        <a
          href="transaksi.html"
          class="sidebar__link sidebar__link--active"
          data-route="transaksi.html"
          aria-current="page">

          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-swap"/>
          </svg>

          <span>Transaksi</span>
        </a>

        <a
          href="../auth/login/pustakawan.html"
          class="sidebar__link sidebar__link--logout"
          data-route="../auth/login/pustakawan.html">

          <svg class="icon icon--sm" aria-hidden="true">
            <use href="#i-logout"/>
          </svg>

          <span>Keluar</span>
        </a>

      </nav>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="admin-content transaction-content">

      <header class="transaction-heading">
        <h1 class="page-title">
          Transaksi Peminjaman
        </h1>
      </header>

      <!-- PENCARIAN -->
      <section
        class="panel transaction-search"
        aria-label="Pencarian transaksi">

        <form
          class="transaction-search__form"
          id="transactionSearchForm"
          data-search-form="transactions"
          role="search">

          <label
            class="transaction-search__field"
            for="keyword">

            <svg class="icon" aria-hidden="true">
              <use href="#i-search"/>
            </svg>

            <input
              id="keyword"
              name="keyword"
              type="search"
              placeholder="id buku"
              autocomplete="off"
              aria-label="Cari ID transaksi, anggota, atau buku">

          </label>

          <button
            class="transaction-search__button"
            type="submit"
            data-action="search-transactions">

            CARI

          </button>

        </form>
      </section>

      <!-- TABEL TRANSAKSI -->
      <section
        class="panel transaction-table-panel"
        aria-labelledby="transactionTableTitle">

        <header class="transaction-table-panel__header">

          <span
            class="transaction-table-panel__indicator"
            aria-hidden="true">
          </span>

          <h2 id="transactionTableTitle">
            Daftar Transaksi Sirkulasi
          </h2>

        </header>

        <div class="transaction-table-scroll">

          <table class="transaction-table">

            <caption class="visually-hidden">
              Daftar transaksi peminjaman dan pengembalian buku
            </caption>

            <colgroup>
              <col class="transaction-col-id">
              <col class="transaction-col-member">
              <col class="transaction-col-program">
              <col class="transaction-col-book">
              <col class="transaction-col-date">
              <col class="transaction-col-status">
            </colgroup>

            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">ANGGOTA</th>
                <th scope="col">PRODI</th>
                <th scope="col">BUKU</th>
                <th scope="col">TANGGAL</th>
                <th scope="col">STATUS</th>
              </tr>
            </thead>

            <tbody id="transactionTableBody">

              <tr>
                <td colspan="6" class="transaction-empty">
                  Memuat data transaksi...
                </td>
              </tr>

            </tbody>

          </table>

        </div>
      </section>

    </main>
  </div>

  <!-- JavaScript transaksi -->
  <script src="../js/pustakawan/transaksi.js" defer></script>

  <!-- JavaScript umum -->
  <script src="../js/shared/app.js" defer></script>

</body>
</html>
